[project]
name = "pporlock"
version = "0.12.1"
description = "Local HTTPS interception and modification proxy daemon"
requires-python = "==3.12.*"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Tim Howland", email = "th@wdogsystems.com" }]

# mitmproxy is pinned EXACTLY (REQ PXY-006).
# Upgrades are deliberate work against the addon/ adapter layer and are
# gated on the integration suite (REQ TST-007). Do not float this pin.
dependencies = [
    "mitmproxy==12.2.3",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    # Transitive floors. mitmproxy caps these; the resolver would otherwise
    # settle below the cap and inherit advisories that are fixable inside it.
    # Each is the lowest version clearing a known CVE while staying under
    # mitmproxy 12.2.3's own upper bound.
    "cryptography>=48.0.1",   # GHSA-537c-gmf6-5ccf ; mitmproxy allows <=48.1
    "pyOpenSSL>=26.0.0",      # PYSEC-2026-2268/2269 ; mitmproxy allows <=27.0.0
    "flask>=3.1.3",           # PYSEC-2026-1377/2151 ; mitmproxy allows <=3.1.3
    "Brotli>=1.2.0",          # PYSEC-2026-2401 ; mitmproxy allows <=1.2.0.
    # On our path: we decode brotli bodies (REQ PXY-023).
    "starlette>=0.41.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
pporlock = "pporlock.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.3",
    "types-pyyaml>=6.0.12",
    "referencing>=0.37.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pporlock"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires the fixture origin server",
    "slow: long-running (soak, benchmark)",
]

# -------------------------------------------------------------- coverage ----
# Gate G2: daemon >= 80%. The engine/ package carries a higher bar (REQ TST-002)
# and is enforced separately by `make coverage`.
[tool.coverage.run]
source = ["src/pporlock"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "S",         # bandit-style security rules
    "ASYNC",     # async correctness — load-bearing, we share the proxy event loop
    "RUF",
]
ignore = [
    "S101",      # assert — used in tests and in load-bearing invariant checks
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures may carry fake secrets and hard-coded temp paths.
# S104 ("binding to all interfaces") fires on the literal "0.0.0.0" in
# test_config.py — where it appears precisely because those tests assert that we
# REFUSE to bind it (REQ API-010). Suppressing the finding in tests keeps the
# rule live everywhere it can catch a real mistake.
"tests/**" = ["S105", "S106", "S108", "S104"]

# The benchmark harness (REQ PRF-003) is not part of the shipped package, so it
# reaches pporlock through an explicit sys.path insert. E402 fires on the
# imports that follow it; the isort block ordering (I001) fires for the same
# reason. Both are consequences of that one deliberate arrangement.
"bench/**" = ["E402", "I001"]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# The engine is pure and fully typed — it is the load-bearing testable core.
[[tool.mypy.overrides]]
module = "pporlock.engine.*"
strict = true

# mitmproxy ships partial types; the adapter layer absorbs that.
[[tool.mypy.overrides]]
module = ["mitmproxy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- bandit ----
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[project.urls]
Homepage = "https://github.com/thowland/pporlock"
Source = "https://github.com/thowland/pporlock"
Issues = "https://github.com/thowland/pporlock/issues"
