name: local-bundle
version: "1.0.0"
pporlock_api: "1"
description: >
  Serves a local build in place of a deployed bundle, and removes the
  subresource-integrity attributes that would otherwise reject it.
author: pporlock examples
enabled: false
priority: 30

rules:
  # Order matters and the engine does not enforce it for you: without the SRI
  # strip the browser fetches your file, hashes it, finds it does not match the
  # integrity attribute, and refuses to run it — with a console error that says
  # nothing about this module.
  - name: drop-integrity-attributes
    action: body
    match:
      # content_type alone, deliberately — no `dest: document`.
      #
      # Sec-Fetch-Dest is only sent on secure contexts. pporlock infers it from
      # Accept otherwise, which works for a browser navigation and not for a
      # plain `curl`, so a rule requiring it silently matches nothing on http://
      # origins and in most command-line testing. content_type is enough here:
      # inject_style needs a <head> and a fragment has none, so an HTML snippet
      # fetched by XHR is a no-op rather than a surprise.
      content_type: "text/html"
    transform:
      kind: strip_integrity_attributes

  - name: serve-local-build
    action: map_local
    file: app.js
    content_type: "application/javascript; charset=utf-8"
    match:
      # Anchor and escape. An unanchored "app.js" also matches
      # /vendor/not-your-app.js.min, and the dot is a regex wildcard.
      path: "^/static/app\\.js$"
