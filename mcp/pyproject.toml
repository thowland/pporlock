[project]
name = "pporlock-mcp"
version = "0.7.0"
description = "MCP stdio server for pporlock — HTTP client of the control API"
requires-python = "==3.12.*"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Tim Howland", email = "th@wdogsystems.com" }]
dependencies = [
    # 2.x only: the lowlevel Server takes on_list_tools/on_call_tool handlers
    # rather than decorators, and ToolAnnotations fields are snake_case.
    "mcp>=2.1.0",
    "httpx>=0.28.0",
]

[project.scripts]
pporlock-mcp = "pporlock_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pporlock_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/pporlock_mcp"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests carry fake bearer tokens by design; S105/S106 fire on every one of them.
"tests/**" = ["S105", "S106"]

# The MCP server is small, pure, and entirely I/O-boundary code, so it carries
# the strict bar the daemon reserves for engine/ (CLAUDE.md, G5).
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true

# mcp and httpx both ship types; nothing here needs an escape hatch.

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[project.urls]
Homepage = "https://github.com/thowland/pporlock"
Source = "https://github.com/thowland/pporlock"
Issues = "https://github.com/thowland/pporlock/issues"
